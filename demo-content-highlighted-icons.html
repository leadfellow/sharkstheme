<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content with Highlighted - All Icons Demo</title>
  <link rel="stylesheet" href="assets/css/30-components/content-highlighted.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Helvetica', sans-serif;
    }

    :root {
      --font-sans: 'Helvetica', Arial, sans-serif;
    }

    .demo-title {
      padding: 20px;
      text-align: center;
      background: #f0f0f0;
      font-size: 14px;
      color: #666;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Icon: STAR (default) -->
  <div class="demo-title">Icon: STAR (Default)</div>
  <section class="block-content-highlighted" style="background-color: #000000;">
    <div class="block-content-highlighted__container">
      <div class="block-content-highlighted__content">
        
        <div class="block-content-highlighted__icon-container">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none"><path d="M21.0001 0.000135629L21.0042 20.9795L29.0365 1.59866L21.0118 20.9827L35.8493 6.1509L21.0176 20.9885L40.4016 12.9637L21.0208 20.9961L42.0001 21.0001L21.0208 21.0042L40.4016 29.0365L21.0176 21.0118L35.8493 35.8493L21.0118 21.0176L29.0365 40.4016L21.0042 21.0208L21.0001 42.0001L20.9961 21.0208L12.9637 40.4016L20.9885 21.0176L6.1509 35.8493L20.9827 21.0118L1.59866 29.0365L20.9795 21.0042L0.000135629 21.0001L20.9795 20.9961L1.59866 12.9637L20.9827 20.9885L6.1509 6.1509L20.9885 20.9827L12.9637 1.59866L20.9961 20.9795L21.0001 0.000135629Z" stroke="white" stroke-width="1.4"/></svg>
        </div>
        
        <div class="block-content-highlighted__text" style="color: #757472;">
          See on <span class="block-content-highlighted__text-highlight" style="color: #FFFFFF;">star ikooni</span> näidis, mis on <span class="block-content-highlighted__text-highlight" style="color: #FFFFFF;">vaikimisi valik</span> komponendis.
        </div>
        
      </div>
    </div>
  </section>

  <!-- Icon: X -->
  <div class="demo-title">Icon: X</div>
  <section class="block-content-highlighted" style="background-color: #1a1a1a;">
    <div class="block-content-highlighted__container">
      <div class="block-content-highlighted__content">
        
        <div class="block-content-highlighted__icon-container">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none"><path d="M40.029 2.00474C38.9866 0.962359 37.2758 0.962359 36.2334 2.00474L29.5478 8.69037C24.8177 13.4204 17.1823 13.4204 12.4522 8.69037L5.76657 2.00474C4.72419 0.962359 3.01343 0.962359 1.97105 2.00474C0.928666 3.04712 0.928666 4.75788 1.97105 5.80026L8.65668 12.4859C13.3867 17.216 13.3867 24.8513 8.65668 29.5814L1.97105 36.267C0.928666 37.3094 0.928666 39.0202 1.97105 40.0625C3.01343 41.1049 4.72419 41.1049 5.76657 40.0625L12.4522 33.3769C17.1823 28.6468 24.8177 28.6468 29.5478 33.3769L36.2334 40.0625C37.2758 41.1049 38.9866 41.1049 40.029 40.0625C41.0714 39.0202 41.0714 37.3094 40.029 36.267L33.3433 29.5814C28.6133 24.8513 28.6133 17.216 33.3433 12.4859L40.029 5.80026C41.0714 4.75788 41.0714 3.04712 40.029 2.00474Z" fill="white"/></svg>
        </div>
        
        <div class="block-content-highlighted__text" style="color: #888888;">
          <span class="block-content-highlighted__text-highlight" style="color: #FFFFFF;">X ikoon</span> sobib hästi <span class="block-content-highlighted__text-highlight" style="color: #FFFFFF;">modernse disaini</span> jaoks.
        </div>
        
      </div>
    </div>
  </section>

  <!-- Icon: ASTERISK -->
  <div class="demo-title">Icon: ASTERISK</div>
  <section class="block-content-highlighted" style="background-color: #2d2d2d;">
    <div class="block-content-highlighted__container">
      <div class="block-content-highlighted__content">
        
        <div class="block-content-highlighted__icon-container">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none"><path d="M26.0749 8.68674L31.7549 3.00677L38.9894 10.2413L33.3094 15.9213H41.2567V26.0748H33.9457L39.4105 31.1158L32.4387 38.5639L26.0749 32.7405V41.254H15.9213V33.2535L10.2413 38.9335L3.00781 31.699L8.68778 26.0748H0.645996V15.9213H8.03419L2.62219 10.8651L9.59397 3.41797L15.9213 9.30474V0.645996H26.0749V8.68674Z" fill="white"/></svg>
        </div>
        
        <div class="block-content-highlighted__text" style="color: #999999;">
          <span class="block-content-highlighted__text-highlight" style="color: #00ff88;">Asterisk ikoon</span> lisab <span class="block-content-highlighted__text-highlight" style="color: #00ff88;">visuaalset huvi</span> ja on silmatorkav.
        </div>
        
      </div>
    </div>
  </section>

  <!-- Icon: CIRCLE -->
  <div class="demo-title">Icon: CIRCLE</div>
  <section class="block-content-highlighted" style="background-color: #0a0a0a;">
    <div class="block-content-highlighted__container">
      <div class="block-content-highlighted__content">
        
        <div class="block-content-highlighted__icon-container">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none"><circle cx="21" cy="21" r="20" fill="white"/></svg>
        </div>
        
        <div class="block-content-highlighted__text" style="color: #aaaaaa;">
          <span class="block-content-highlighted__text-highlight" style="color: #ff6b00;">Circle ikoon</span> on <span class="block-content-highlighted__text-highlight" style="color: #ff6b00;">minimalistlik</span> ja elegantne valik.
        </div>
        
      </div>
    </div>
  </section>

</body>
</html>
