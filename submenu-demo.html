<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Sharks - Submenu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica', sans-serif;
            background: white;
            width: 100%;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: white;
            width: 100%;
            border-bottom: 1px solid #BBBAB6;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 58px;
            max-width: 1440px;
            margin: 0 auto;
        }

        .logo {
            width: 180px;
            height: 60px;
            position: relative;
        }

        .logo svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav p {
            font-family: 'Manrope', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: black;
            text-align: center;
            white-space: nowrap;
            cursor: pointer;
        }

        .nav p.active {
            text-decoration: underline;
            text-decoration-skip-ink: none;
            text-underline-offset: 2px;
        }

        .cta-button {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            padding: 15px 26px 15px 15px;
            border: 1.5px solid black;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .cta-button:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .cta-button p {
            font-family: 'Switzer', sans-serif;
            font-weight: 500;
            font-size: 20px;
            color: black;
            white-space: nowrap;
            letter-spacing: -0.6px;
        }

        .cta-button svg {
            width: 24px;
            height: 24px;
        }

        /* Main content - Submenu */
        .main-content {
            background: white;
            width: 100%;
            flex: 1;
        }

        .content-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-start;
            padding: 42px 58px;
            gap: 62px;
            max-width: 1440px;
            margin: 0 auto;
        }

        /* Left column - Menu items */
        .left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            max-width: 946px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 0;
            border-bottom: 1px solid #BBBAB6;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-item:first-child {
            border-top: 1px solid #BBBAB6;
        }

        .menu-item p {
            font-family: 'Switzer', sans-serif;
            font-weight: 500;
            font-size: 42px;
            color: black;
            white-space: nowrap;
            letter-spacing: -2.1px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .arrow-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .menu-item:hover .arrow-circle {
            opacity: 1;
            background: rgba(0, 0, 0, 0.05);
        }

        .arrow-circle svg {
            width: 27px;
            height: 22px;
        }

        /* Right side - Black square with asterisk */
        .black-square {
            width: 316px;
            height: 316px;
            background: black;
            position: relative;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .yellow-square {
            position: absolute;
            width: 215px;
            height: 215px;
            background: #FFC700;
            border: 1px solid #757472;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .asterisk-icon {
            position: absolute;
            width: 23px;
            height: 35px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .asterisk-icon svg {
            width: 100%;
            height: 100%;
        }

        @media (max-width: 1200px) {
            .header-content {
                padding: 20px 30px;
            }
            
            .nav {
                gap: 20px;
            }
            
            .nav p {
                font-size: 16px;
            }
            
            .content-wrapper {
                padding: 30px;
            }
            
            .menu-item p {
                font-size: 32px;
            }
            
            .black-square {
                width: 250px;
                height: 250px;
            }
            
            .yellow-square {
                width: 170px;
                height: 170px;
            }
        }

        @media (max-width: 900px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }
            
            .nav {
                flex-wrap: wrap;
                gap: 15px;
                justify-content: center;
            }
            
            .content-wrapper {
                flex-direction: column;
                gap: 40px;
            }
            
            .menu-item p {
                font-size: 24px;
                white-space: normal;
            }
            
            .black-square {
                width: 200px;
                height: 200px;
                margin: 0 auto;
            }
            
            .yellow-square {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>
