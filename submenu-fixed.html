<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Sharks - Submenu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Switzer';
            src: url('https://cdn.jsdelivr.net/gh/fontsource/fontsource/fonts/switzer/files/switzer-latin-500-normal.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: white;
        }

        .container {
            background-color: white;
            width: 100%;
            min-height: 100vh;
            padding: 42px 58px;
            display: flex;
            flex-direction: column;
        }

        .content-wrapper {
            display: flex;
            gap: 62px;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
        }

        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            max-width: 946px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 0;
            border-bottom: 1px solid #BBBAB6;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-item:first-child {
            border-top: 1px solid #BBBAB6;
        }

        .text-title {
            font-family: 'Switzer', sans-serif;
            font-weight: 500;
            font-size: 42px;
            line-height: 1.1;
            letter-spacing: -2.1px;
            text-transform: uppercase;
            color: black;
            white-space: nowrap;
        }

        .arrow-container {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .menu-item:hover .arrow-container {
            opacity: 1;
            background: rgba(0, 0, 0, 0.05);
        }

        .arrow-container svg {
            width: 27px;
            height: 22px;
        }

        .right-section {
            width: 316px;
            height: 316px;
            position: relative;
            flex-shrink: 0;
        }

        .black-square {
            position: absolute;
            left: 0;
            top: 0;
            width: 316px;
            height: 316px;
            background-color: black;
        }

        .yellow-square {
            position: absolute;
            width: 215px;
            height: 215px;
            background: #FFC700;
            border: 1px solid #757472;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .asterisk-icon {
            position: absolute;
            width: 23px;
            height: 35px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
        }

        .asterisk-icon svg {
            width: 100%;
            height: 100%;
        }

        /* Pattern behind yellow square */
        .pattern-bg {
            position: absolute;
            width: 215px;
            height: 215px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .pattern-bg svg {
            width: 100%;
            height: 100%;
        }

        .asterisk-icon svg {
            width: 100%;
            height: 100%;
        }

        @media (max-width: 1200px) {
            .container {
                padding: 30px;
            }
            
            .content-wrapper {
                gap: 40px;
            }
            
            .text-title {
                font-size: 32px;
            }
            
            .right-section,
            .black-square {
                width: 250px;
                height: 250px;
            }
            
            .yellow-square {
                width: 170px;
                height: 170px;
            }
        }

        @media (max-width: 900px) {
            .content-wrapper {
                flex-direction: column;
            }
            
            .text-title {
                font-size: 24px;
                white-space: normal;
            }
            
            .right-section,
            .black-square {
                width: 200px;
                height: 200px;
                margin: 0 auto;
            }
            
            .yellow-square {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-wrapper">
            <div class="left-section">
                <div class="menu-item">
                    <p class="text-title">SEO</p>
                </div>
                
                <div class="menu-item">
                    <div class="arrow-container">
                        <svg fill="none" viewBox="0 0 28 23">
                            <path d="M1.4296 11.2155L25.8944 11.2155" stroke="black" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8592"/>
                            <path d="M16.1085 1.4296L25.8944 11.2155L16.1085 21.0015" stroke="black" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8592"/>
                        </svg>
                    </div>
                    <p class="text-title">REKLAAM</p>
                </div>
                
                <div class="menu-item">
                    <p class="text-title">TURUNDUS</p>
                </div>
                
                <div class="menu-item">
                    <p class="text-title">ANALÜÜTIKA</p>
                </div>
            </div>
            
            <div class="right-section">
                <div class="black-square">
                    <!-- Pattern background -->
                    <div class="pattern-bg">
                        <svg fill="none" viewBox="0 0 215 215">
                            <path d="M184.591 10.6074C190.059 5.13948 198.925 5.13948 204.393 10.6074C209.861 16.0754 209.861 24.9412 204.393 30.4092L171.15 63.6504C146.933 87.8678 146.933 127.132 171.15 151.35L204.393 184.591C209.861 190.059 209.861 198.925 204.393 204.393C198.925 209.861 190.059 209.861 184.591 204.393L151.35 171.15C127.132 146.933 87.8678 146.933 63.6504 171.15L30.4092 204.393C24.9412 209.861 16.0754 209.861 10.6074 204.393C5.13948 198.925 5.13948 190.059 10.6074 184.591L43.8496 151.35C68.067 127.132 68.067 87.8677 43.8496 63.6504L10.6074 30.4092C5.13947 24.9412 5.13947 16.0754 10.6074 10.6074C16.0754 5.13947 24.9412 5.13947 30.4092 10.6074L63.6504 43.8496C87.8677 68.067 127.132 68.067 151.35 43.8496L184.591 10.6074Z" stroke="#757472" stroke-width="1"/>
                        </svg>
                    </div>
                    
                    <!-- Yellow square -->
                    <div class="yellow-square"></div>
                    
                    <!-- White Sharks logo -->
                    <div class="asterisk-icon">
                        <svg viewBox="0 0 286 429" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M111.882 48.3398L111.547 47.7868L101.767 55.8829C100.271 57.1219 98.1359 57.1086 96.6561 55.851L92.5614 52.3759L92.6547 52.243L97.1511 51.5224L96.428 46.7551L96.4902 46.6647L101.023 45.9389L100.292 41.1317L100.326 41.0865L104.895 40.3553L104.159 35.5083L104.151 35.5189L100.359 29.2361L87.9302 41.9879C87.9302 41.9879 79.2899 38.8797 71.852 41.9879L79.8911 50.2355L69.6051 60.7884L58 62.4768L70.5744 67.8875L76.3095 81.2587L76.7553 69.0627L88.1272 69.1398L89.1301 75.3827C89.1301 75.3827 91.7424 72.2745 93.2041 69.177C99.1051 69.177 104.62 66.1672 107.917 61.1447L114.009 51.8654L111.882 48.3398ZM92.2011 41.9161C92.7998 41.3019 93.7691 41.3019 94.3651 41.9161C94.9638 42.5303 94.9638 43.5219 94.3651 44.1361C93.7691 44.7503 92.7998 44.7503 92.2011 44.1361C91.6051 43.5219 91.6051 42.5303 92.2011 41.9161Z" fill="white"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
